name: CyberGuard CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Lint, Static Analysis & Type Checking
  # ---------------------------------------------------------------------------
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Python Syntax & Lint Check
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Install Node Dependencies
        run: npm ci

      - name: Frontend TypeScript Type Check
        run: npx tsc -b

  # ---------------------------------------------------------------------------
  # Stage 2: Automated Test Suite & Coverage
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Execute Automated Test Suite (Sections 70-74)
        env:
          PYTHONPATH: .
          CYBERGUARD_ENV: TESTING
          DATABASE_URL: sqlite:///backend/data/test_ci.db
        run: |
          mkdir -p backend/data
          pytest backend/tests/test_section74_deployment_infrastructure.py \
                 backend/tests/test_section73_performance_scalability.py \
                 backend/tests/test_section72_security_hardening.py \
                 backend/tests/test_section71_platform_administration_governance.py \
                 backend/tests/test_section70_security_operations_automation.py \
                 -v --tb=short

  # ---------------------------------------------------------------------------
  # Stage 3: Frontend Build & Asset Verification
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Compile Production Assets
        run: npm run build

      - name: Verify Distribution Artifacts
        run: |
          test -f dist/index.html || exit 1
          echo "Production assets compiled successfully."

  # ---------------------------------------------------------------------------
  # Stage 4: Docker Multi-Stage Container Build & Security Audit
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build & Non-Root Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: cyberguard-backend:ci-test
          load: true

      - name: Verify Backend Runs as Non-Root User
        run: |
          # Verify the image runs under UID 10001 (cyberguard)
          CONTAINER_USER=$(docker run --rm cyberguard-backend:ci-test id -u)
          if [ "$CONTAINER_USER" != "10001" ]; then
            echo "SECURITY VIOLATION: Container is running as UID $CONTAINER_USER instead of non-root 10001!"
            exit 1
          fi
          echo "Verified: Container correctly runs as non-root UID 10001 (cyberguard)."

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          tags: cyberguard-frontend:ci-test
