<svg xmlns="http://www.w3.org/2000/svg" width="640" height="870" viewBox="0 0 640 870">
<rect width="100%" height="100%" fill="white"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#111"/></marker></defs>
<text x="320.0" y="56" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="bold">Malicious URL Detection Flow</text>
<rect x="42" y="105" width="556" height="100" fill="#FFF9EC" stroke="#333" stroke-width="1"/>
<text x="320.0" y="149.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Submit URL</text>
<text x="320.0" y="171.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Strip input; preserve URL evidence</text>
<line x1="320.0" y1="208" x2="320.0" y2="227" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="42" y="230" width="556" height="100" fill="#FFF9EC" stroke="#333" stroke-width="1"/>
<text x="320.0" y="263.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">PassiveURLAnalyzer: urlsplit</text>
<text x="320.0" y="285.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Check userinfo, IP hosts, ports,</text>
<text x="320.0" y="307.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">paths, subdomains and shorteners</text>
<line x1="320.0" y1="333" x2="320.0" y2="352" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="42" y="355" width="556" height="100" fill="#FFF9EC" stroke="#333" stroke-width="1"/>
<text x="320.0" y="388.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">DomainIntelligenceAnalyzer</text>
<text x="320.0" y="410.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">DNS + RDAP + IDN/lookalike checks</text>
<text x="320.0" y="432.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Configured threat-intelligence lookup</text>
<line x1="320.0" y1="458" x2="320.0" y2="477" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="42" y="480" width="556" height="100" fill="#FFF9EC" stroke="#333" stroke-width="1"/>
<text x="320.0" y="513.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">SafeWebsiteAnalyzer, if enabled</text>
<text x="320.0" y="535.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">SafeHttpClient: redirects and TLS</text>
<text x="320.0" y="557.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Inspect HTML forms and password inputs</text>
<line x1="320.0" y1="583" x2="320.0" y2="602" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="42" y="605" width="556" height="100" fill="#FFF9EC" stroke="#333" stroke-width="1"/>
<text x="320.0" y="649.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">_compute_overall_risk(findings)</text>
<text x="320.0" y="671.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Aggregate URL/domain/website signals</text>
<line x1="320.0" y1="708" x2="320.0" y2="727" stroke="#111" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="42" y="730" width="556" height="100" fill="#EFEDF4" stroke="#333" stroke-width="1"/>
<text x="320.0" y="774.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Persist findings and evidence</text>
<text x="320.0" y="796.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Return URL risk score and severity</text>
<text x="320.0" y="851" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">Active website inspection is optional; unavailable data stays limited.</text></svg>