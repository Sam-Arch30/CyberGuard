<text x="320.0" y="535.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Compare names, trusted addresses/domains</text>
<text x="320.0" y="557.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Check lookalikes and Reply-To mismatch</text>
