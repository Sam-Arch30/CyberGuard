<text x="320.0" y="638.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">_synthesize_assessment</text>
<text x="320.0" y="660.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Sum supporting risk; discount counter-evidence</text>
<text x="320.0" y="682.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Cap score at 100</text>
