<text x="320.0" y="774.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="bold">Return impersonation assessment</text>
<text x="320.0" y="796.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="normal">Findings, counter-evidence and limitations</text>
<text x="320.0" y="851" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#555">No matched reference profile can produce insufficient evidence.</text></svg>